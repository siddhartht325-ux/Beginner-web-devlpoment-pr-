 <!DOCTYPE html> <!-- doctype declaration  means this is an hyper text markup language file -->

<html> <!--html tag is the root element of the HTML page-->

<head>
    <title>My First HTML Practical</title><!--title of the web page-->

</head> <!--head section of the web page contains meta information about the web page-->

<body><!--body section of the web page contains the content of the web page-->

    <h1>My First Web Page</h1> <!--h1 is the largest heading tag in HTML-->

    <h2>About Me</h2> <!--h2 is the second largest heading tag in HTML-->

    <p>My name is Siddharth.</p><!--p is the paragraph tag in HTML-->
    

    <p>I am learning HTML.</p><!--p is the paragraph tag in HTML-->

    <h2>My College</h2><!--h2 is the second largest heading tag in HTML-->
    <p>I am a B.Tech CSE student.</p><!--p is the paragraph tag in HTML-->

    <a href="https://www.google.com">Visit Google</a><!--a is the anchor tag in HTML--> <!--why we use this anchor tag-->
       <!-- anchor tag is used to create hyperlinks in HTML. It allows users to click on the link and navigate to another webpage or resource specified in the href attribute. In this case, clicking on "Visit Google" will take the user to the Google homepage-->

    <br><br> 

    <img src="photo.jpg" alt="My Photo"><!-- you can add an image using the img tag -->

</body>

</html>
